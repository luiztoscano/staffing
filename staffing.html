<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staffing</title>
  <link rel="stylesheet" href="css/staffing.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegacao principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div>
          <strong>Staffing</strong>
          <span>Projetos, roles e candidatos</span>
        </div>
      </div>

      <nav class="nav-list" id="navList"></nav>

      <section class="storage-panel" aria-label="Banco de dados">
        <div>
          <span class="eyebrow">Banco local</span>
          <strong id="dbStatus">Demo em memoria</strong>
        </div>
        <div class="storage-actions">
          <button class="icon-button" id="openDbButton" type="button" title="Abrir banco" aria-label="Abrir banco">↑</button>
          <button class="icon-button" id="saveDbButton" type="button" title="Salvar banco" aria-label="Salvar banco">↓</button>
          <input class="visually-hidden" id="openDbInput" type="file" accept=".db,.sqlite,.sqlite3,application/vnd.sqlite3">
        </div>
      </section>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <span class="eyebrow" id="viewEyebrow">Visao geral</span>
          <h1 id="viewTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="globalSearch" type="search" placeholder="Buscar projetos, roles, candidatos">
          </label>
          <button class="primary-button" id="primaryAction" type="button">Nova candidatura</button>
        </div>
      </header>

      <section class="content" id="appContent" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/sample-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
